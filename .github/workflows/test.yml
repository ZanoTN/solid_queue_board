name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches breaking changes in new Solid Queue / Rails releases.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
